name: Atualizar Index Starnin

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Copiar repositório
        uses: actions/checkout@v4

      - name: Gerar index.json com shell
        run: |
          echo "{" > index.json
          echo "  \"Pages\": [" >> index.json
          
          first=true
          for file in $(find . -name "*.json" ! -name "index.json" -not -path "*/.*" | sort); do
            if [ "$first" = true ]; then
              first=false
            else
              echo "," >> index.json
            fi
            echo "    \"$file\"" >> index.json
          done
          
          echo "" >> index.json
          echo "  ]" >> index.json
          echo "}" >> index.json

      - name: Commitar alterações no índice
        uses: stefanzweifel/git-auto-commit-action@v5
        with:
          commit_message: "Auto-atualização do index.json via workflow [skip ci]"
          file_pattern: "index.json"
          
